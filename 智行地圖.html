      navigator.mediaSession.playbackState = v ? 'playing' : 'paused';
  }

  function updateMediaSession(){
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: STATIONS[idx].name,
      artist: '警察廣播電台',
      album: STATIONS[idx].freq + ' MHz',
      artwork: [{ src: PBS_ART, sizes:'512x512', type:'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play',  function(){ startPlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){ if(!window._ttsActive) pausePlay(); });
    navigator.mediaSession.setActionHandler('stop',  function(){ if(!window._ttsActive) pausePlay(); });
  }

  function startPlay(){
    setStatus('連線中…');
    updateMediaSession();
    vjs.src([{ src: BASE + STATIONS[idx].code + '/playlist.m3u8', type:'application/x-mpegURL' }]);
    vjs.play().catch(function(){ setPlaying(false); setStatus('點擊收聽'); });
  }
  function pausePlay(){ vjs.pause(); setPlaying(false); setStatus('已暫停'); }

  function switchStation(delta){
    idx = (idx + delta + STATIONS.length) % STATIONS.length;
    updateDial();
    if(playing){ vjs.pause(); startPlay(); }
    else { setStatus('點擊收聽'); }
  }

  if(prevBtn) prevBtn.addEventListener('click', function(e){ e.stopPropagation(); switchStation(-1); });
  if(nextBtn) nextBtn.addEventListener('click', function(e){ e.stopPropagation(); switchStation(1); });
  if(playBtn) playBtn.addEventListener('click', function(e){ e.stopPropagation(); playing ? pausePlay() : startPlay(); });

  /* 拖曳刻度盤換台：手指跟著動，放開才 snap */
  if(dial){
    var dragStart = null, baseOffset = null, dragging = false;

    function getOffset(i){ return getDialCenter() - i * TICK_W - TICK_W / 2; }

    function onDown(e){
      var mat = window.getComputedStyle(track).transform;
      baseOffset = (mat && mat !== 'none') ? new DOMMatrix(mat).m41 : getOffset(idx);
      track.style.transition = 'none';
      track.style.transform = 'translateX(' + baseOffset + 'px)';
      dragStart = e.touches ? e.touches[0].clientX : e.clientX;
      dragging = true;
      e.stopPropagation();
    }
    function onMove(e){
      if(!dragging) return;
      var x = e.touches ? e.touches[0].clientX : e.clientX;
      var dx = x - dragStart;
      track.style.transform = 'translateX(' + (baseOffset + dx) + 'px)';
      /* 即時高亮最近的刻度 */
      var newIdx = Math.round((getDialCenter() - TICK_W / 2 - (baseOffset + dx)) / TICK_W);
      newIdx = Math.max(0, Math.min(STATIONS.length - 1, newIdx));
      track.querySelectorAll('.fmTick').forEach(function(t, i){
        t.classList.toggle('active', i === newIdx);
      });
      if(newIdx !== idx){
        idx = newIdx;
        if(nameEl) nameEl.textContent = STATIONS[idx].name;
        if(freqEl) freqEl.textContent = STATIONS[idx].freq + ' MHz';
        updateMediaSession();
        if(playing){ vjs.pause(); startPlay(); }
      }
      e.preventDefault();
    }
    function onUp(){
      if(!dragging) return;
      dragging = false;
      dragStart = null;
      /* snap 動畫 */
      track.style.transition = 'transform 0.2s cubic-bezier(.4,0,.2,1)';
      track.style.transform = 'translateX(' + getOffset(idx) + 'px)';
      if(!playing) setStatus('點擊收聽');
    }
    dial.addEventListener('mousedown',  onDown);
    dial.addEventListener('touchstart', onDown, { passive:false });
    window.addEventListener('mousemove',  onMove);
    window.addEventListener('touchmove',  onMove, { passive:false });
    window.addEventListener('mouseup',  onUp);
    window.addEventListener('touchend', onUp);
  }

  vjs.on('playing', function(){ setPlaying(true); setStatus('直播中'); });
  vjs.on('waiting', function(){ if(playing && !window._ttsActive) setStatus('緩衝中…'); });
  vjs.on('error',   function(){ setPlaying(false); setStatus('點擊重試'); });
  vjs.on('pause',   function(){ if(window._ttsActive) return; if(playing){ setPlaying(false); setStatus('已暫停'); } });
  window.addEventListener('pagehide', function(){ if(playing) pausePlay(); });

  updateDial();

  // ===== 🎵 模擬真實音頻波動（每條 bar 各自頻率，JS 驅動，不需 CORS）=====
  var _waveRaf = null;
  var _waveEl = document.getElementById('radioWaveform');
  var _waveSpans = _waveEl ? Array.from(_waveEl.querySelectorAll('span')) : [];
  // 每條 bar 獨立震盪頻率和相位，模擬多頻道音頻
  var _wFreq  = [1.4, 2.3, 1.9, 2.7, 1.2];
  var _wPhase = [0.0, 1.1, 2.3, 3.5, 4.7];
  // 每條 bar 額外加的慢速「呼吸」包絡，讓整體有起伏感
  var _wEnvFreq  = [0.31, 0.27, 0.35, 0.22, 0.29];
  var _wEnvPhase = [0.0,  0.9,  1.8,  2.7,  3.6];

  function _startRealWave(){
    if(_waveEl) _waveEl.setAttribute('data-realwave','1');
    if(_waveRaf) cancelAnimationFrame(_waveRaf);
    function tick(ts){
      _waveRaf = requestAnimationFrame(tick);
      var t = ts * 0.001; // 秒
      for(var i=0;i<5;i++){
        // 主頻 + 包絡相乘，值域 0–1
        var main = (Math.sin(t * _wFreq[i] * 6.28 + _wPhase[i]) + 1) * 0.5;
        var env  = (Math.sin(t * _wEnvFreq[i] * 6.28 + _wEnvPhase[i]) + 1) * 0.5;
        var v    = main * (0.4 + env * 0.6); // 0–1，有低谷也有高峰
        if(_waveSpans[i]) _waveSpans[i].style.height = (2 + v * 12).toFixed(1) + 'px';
      }
    }
    requestAnimationFrame(tick);
  }

  function _stopRealWave(){
    if(_waveRaf){ cancelAnimationFrame(_waveRaf); _waveRaf = null; }
    if(_waveEl) _waveEl.removeAttribute('data-realwave');
  }

  vjs.on('playing', function(){ _startRealWave(); });
  vjs.on('pause',   function(){ if(!window._ttsActive) _stopRealWave(); });
  vjs.on('error',   function(){ _stopRealWave(); });

})();
</script>
<script>
(function(){
  var c=document.createElement('canvas');
  c.width=c.height=180;
  var ctx=c.getContext('2d');

  // 藍色漸層背景（高德風格：左上亮藍→右下深藍）
  var bg=ctx.createLinearGradient(0,0,180,180);
  bg.addColorStop(0,'#4DAAFF');
  bg.addColorStop(1,'#0048CC');
  ctx.beginPath();
  ctx.roundRect(0,0,180,180,38);
  ctx.fillStyle=bg;
  ctx.fill();

  // 頂部光澤
  var shine=ctx.createLinearGradient(0,0,0,100);
  shine.addColorStop(0,'rgba(255,255,255,0.22)');
  shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(0,0,180,180,38);
  ctx.clip();
  ctx.fillStyle=shine;
  ctx.fillRect(0,0,180,100);
  ctx.restore();

  // 定位針陰影
  ctx.shadowColor='rgba(0,30,100,0.45)';
  ctx.shadowBlur=14;
  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=8;

  // 定位針（淚滴形）
  var cx=90,cy=68,r=36;
  ctx.fillStyle='#FFFFFF';
  ctx.beginPath();
  ctx.moveTo(cx,cy+r+44);
  ctx.bezierCurveTo(cx-18,cy+r+22,cx-r,cy+r*0.25,cx-r,cy);
  ctx.arc(cx,cy,r,Math.PI,0,false);
  ctx.bezierCurveTo(cx+r,cy+r*0.25,cx+18,cy+r+22,cx,cy+r+44);
  ctx.closePath();
  ctx.fill();

  // 內圓漸層
  ctx.shadowColor='transparent';
  var ig=ctx.createLinearGradient(cx-18,cy-18,cx+18,cy+18);
  ig.addColorStop(0,'#70C0FF');
  ig.addColorStop(1,'#0048CC');
  ctx.beginPath();
  ctx.arc(cx,cy,17,0,Math.PI*2);
  ctx.fillStyle=ig;
  ctx.fill();

  // 中心白點
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.arc(cx,cy,7,0,Math.PI*2);
  ctx.fill();

  var dataUrl=c.toDataURL('image/png');
  window.appLogoDataUrl=dataUrl;
  var link=document.getElementById('appTouchIcon');
  if(link) link.href=dataUrl;

})();
</script>

<script>
/* ===== CCTV 攝影機整合（資料來自 cctv_data.js） ===== */
(function(){

  function buildGeoJSON(data){
    var features = [];
    for(var i=0;i<data.length;i++){
      var d=data[i];
      if(!d.lon||!d.lat) continue;
      features.push({
        type:'Feature',
        geometry:{type:'Point',coordinates:[d.lon,d.lat]},
        properties:{url:d.url,road:d.road,mile:d.mile,desc:d.desc||''}
      });
    }
    return {type:'FeatureCollection',features:features};
  }

  function initLayers(m, geojson){
    if(m.getSource('cctv')) return;
    // 產生 📷 emoji + 下方三角指針圖示（圖釘樣式）
    if(!m.hasImage('cctv-icon')){
      var ew=48, eh=60, tip=10; // ew=寬, eh=高(含三角), tip=三角高度
      var cv=document.createElement('canvas'); cv.width=ew; cv.height=eh;
      var cx=cv.getContext('2d');
      // 下方三角指針
      cx.fillStyle='rgba(255,255,255,0.88)';
      cx.beginPath();
      cx.moveTo(ew/2-8, eh-tip); cx.lineTo(ew/2+8, eh-tip); cx.lineTo(ew/2, eh); cx.closePath();
      cx.fill();
      // 📷 emoji
      cx.font=(ew*0.76)+'px serif';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText('📷', ew/2, (eh-tip)/2);
      m.addImage('cctv-icon',{width:ew,height:eh,data:cx.getImageData(0,0,ew,eh).data});
    }

    m.addSource('cctv',{
      type:'geojson',
      data: geojson,
      cluster: true,
      clusterMaxZoom: 13,
      clusterRadius: 50
    });

    // 群集層：📷 emoji + 數字
    m.addLayer({
      id:'cctv-clusters',
      type:'symbol',
      source:'cctv',
      filter:['has','point_count'],
      layout:{
        'icon-image':'cctv-icon',
        'icon-size':0.8,
        'icon-allow-overlap':true,
        'icon-ignore-placement':true,
        'text-field':['get','point_count_abbreviated'],
        'text-size':11,
        'text-font':['Noto Sans Bold'],
        'text-offset':[0,2.1],
        'text-allow-overlap':true,
        'text-ignore-placement':true,
        'text-anchor':'top'
      },
      paint:{
        'text-color':'#1A6ADB',
        'text-halo-color':'#fff',
        'text-halo-width':1.5
      }
    });

    m.addLayer({
      id:'cctv-point',
      type:'symbol',
      source:'cctv',
      filter:['!',['has','point_count']],
      layout:{
        'icon-image':'cctv-icon',
        'icon-size':['interpolate',['linear'],['zoom'],12,0.4,15,0.7,17,1.0,19,1.4],
        'icon-allow-overlap':true,
        'icon-ignore-placement':true
      }
    });

    m.on('click','cctv-clusters',function(e){
      var f=m.queryRenderedFeatures(e.point,{layers:['cctv-clusters']});
      if(!f.length) return;
      m.getSource('cctv').getClusterExpansionZoom(f[0].properties.cluster_id,function(err,zoom){
        if(err) return;
        m.easeTo({center:f[0].geometry.coordinates,zoom:zoom+0.5});
      });
    });

    var cctvPopup = null;
    m.on('click','cctv-point',function(e){
      var props=e.features[0].properties;
      var coords=e.features[0].geometry.coordinates.slice();
      if(cctvPopup) cctvPopup.remove();
      var uid='cctv_'+Date.now();
      var baseUrl=props.url;
      var sep=baseUrl.indexOf('?')>=0?'&':'?';
      var refreshTimer=null;
      var label=props.desc||((props.road||'')+(props.mile?' '+props.mile:''));
      cctvPopup=new maplibregl.Popup({maxWidth:'320px',closeButton:true})
        .setLngLat(coords)
        .setHTML(
          '<div style="font-size:12px;font-weight:700;color:#1A6ADB;margin-bottom:5px">'+label+'</div>'+
          '<img id="'+uid+'" src="'+baseUrl+sep+'t='+Date.now()+'" style="width:300px;height:200px;object-fit:cover;border-radius:8px;display:block;background:#000">'+
          '<div style="color:#888;font-size:11px;margin-top:4px">點擊關閉即停止串流</div>'
        )
        .addTo(m);
      function reconnect(){
        var img=document.getElementById(uid);
        if(!img) return;
        img.onerror=function(){ setTimeout(reconnect,2000); };
        img.src=baseUrl+sep+'t='+Date.now();
      }
      var img=document.getElementById(uid);
      if(img) img.onerror=function(){ setTimeout(reconnect,2000); };
      refreshTimer=setInterval(reconnect,8000);
      cctvPopup.on('close',function(){
        clearInterval(refreshTimer);
        var img=document.getElementById(uid);
        if(img) img.src='';
        cctvPopup=null;
      });
    });

    ['cctv-clusters','cctv-point'].forEach(function(id){
      m.on('mouseenter',id,function(){ m.getCanvas().style.cursor='pointer'; });
      m.on('mouseleave',id,function(){ m.getCanvas().style.cursor=''; });
    });
  }

  // 等 map 及資料就緒（合併原始 + THB 攝影機）
  function tryInit(){
    var m = window.map;
    var data = window.CCTV_DATA;
    if(!m || !data){ setTimeout(tryInit, 300); return; }
    var thb = window.THB_CCTV_DATA || [];
    var merged = data.concat(thb);
    window.cctvCameras = merged; // 供 checkCctvProximity 使用
    var geojson = buildGeoJSON(merged);
    if(m.loaded()){
      initLayers(m, geojson);
    } else {
      m.once('load', function(){ initLayers(m, geojson); });
    }
  }
  tryInit();
})();
</script>
<script>
/* ===== 測速照相地圖圖層 ===== */
(function(){
  function initSpeedLayers(m){
    if(m.getSource('speed-cam')) return;
    var data = window.speedCameraData;
    if(!data) return;

    // 為每個速限值畫紅框白底圓形圖示（底部加三角指針）
    [25,30,40,50,60,70,80,90,100,110].forEach(function(lim){
      var key='speed-'+lim;
      if(m.hasImage(key)) return;
      var sz=60, tip=10, totalH=sz+tip, r=sz/2, border=5;
      var cv=document.createElement('canvas'); cv.width=sz; cv.height=totalH;
      var cx=cv.getContext('2d');
      // 白底圓
      cx.beginPath(); cx.arc(r,r,r-1,0,Math.PI*2);
      cx.fillStyle='#FFFFFF'; cx.fill();
      // 紅框
      cx.beginPath(); cx.arc(r,r,r-border/2,0,Math.PI*2);
      cx.strokeStyle='#FF0000'; cx.lineWidth=border; cx.stroke();
      // 速限文字
      var fs=lim>=100?20:22;
      cx.font='bold '+fs+'px Arial,sans-serif';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillStyle='#000000'; cx.fillText(String(lim),r,r+1);
      // 底部三角指針
      cx.fillStyle='#FFFFFF';
      cx.beginPath();
      cx.moveTo(r-8,sz); cx.lineTo(r+8,sz); cx.lineTo(r,sz+tip); cx.closePath();
      cx.fill();
      m.addImage(key,{width:sz,height:totalH,data:cx.getImageData(0,0,sz,totalH).data});
    });

    m.addSource('speed-cam',{type:'geojson',data:data,cluster:true,clusterMaxZoom:13,clusterRadius:50});

    m.addLayer({
      id:'speed-clusters',type:'circle',source:'speed-cam',
      filter:['has','point_count'],
      paint:{
        'circle-color':['step',['get','point_count'],'#FF9500',10,'#FF6B00',50,'#CC2200'],
        'circle-radius':['step',['get','point_count'],14,10,20,50,26],
        'circle-opacity':0.9,'circle-stroke-width':2,'circle-stroke-color':'#fff'
      }
    });
    m.addLayer({
      id:'speed-point',type:'symbol',source:'speed-cam',
      filter:['!',['has','point_count']],
      layout:{
        'icon-image':['concat','speed-',['to-string',['get','limit']]],
        'icon-size':['interpolate',['linear'],['zoom'],12,0.4,15,0.65,17,0.9,19,1.2],
        'icon-allow-overlap':true,'icon-ignore-placement':true
      }
    });

    m.on('click','speed-clusters',function(e){
      var f=m.queryRenderedFeatures(e.point,{layers:['speed-clusters']});
      if(!f.length) return;
      m.getSource('speed-cam').getClusterExpansionZoom(f[0].properties.cluster_id,function(err,zoom){
        if(err) return;
        m.easeTo({center:f[0].geometry.coordinates,zoom:zoom+0.5});
      });
    });
    m.on('click','speed-point',function(e){
      var p=e.features[0].properties;
      var coords=e.features[0].geometry.coordinates.slice();
      new maplibregl.Popup({closeButton:true,maxWidth:'260px'})
        .setLngLat(coords)
        .setHTML('<div style="font-size:13px;font-weight:700;color:#CC2200">📸 固定測速</div>'+
          '<div style="font-size:12px;margin-top:4px">限速 <b>'+p.limit+'</b> km/h</div>'+
          '<div style="font-size:11px;color:#666;margin-top:2px">'+p.addr+'</div>')
        .addTo(m);
    });
    ['speed-clusters','speed-point'].forEach(function(id){
      m.on('mouseenter',id,function(){ m.getCanvas().style.cursor='pointer'; });
      m.on('mouseleave',id,function(){ m.getCanvas().style.cursor=''; });
    });
  }

  function trySpeedInit(){
    var m=window.map;
    var data=window.speedCameraData;
    if(!m||!data){ setTimeout(trySpeedInit,300); return; }
    if(m.loaded()){ initSpeedLayers(m); }
    else { m.once('load',function(){ initSpeedLayers(m); }); }
  }
  trySpeedInit();
})();
</script>

<script>
/* ===== 🌋 地震震央地圖標記（跟監視器相同樣式）===== */
(function(){
  var eqMarker = null;
  var eqPopup  = null;

  function makeEqIcon(m){
    if(m.hasImage('eq-icon')) return;
    var ew=48, eh=60, tip=10;
    var cv=document.createElement('canvas'); cv.width=ew; cv.height=eh;
    var cx=cv.getContext('2d');
    cx.fillStyle='rgba(255,255,255,0.88)';
    cx.beginPath();
    cx.moveTo(ew/2-8,eh-tip); cx.lineTo(ew/2+8,eh-tip); cx.lineTo(ew/2,eh); cx.closePath();
    cx.fill();
    cx.font=(ew*0.76)+'px serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('🌋',ew/2,(eh-tip)/2);
    m.addImage('eq-icon',{width:ew,height:eh,data:cx.getImageData(0,0,ew,eh).data});
  }

  function showEqPopup(eq, lngLat){
    if(eqPopup) eqPopup.remove();
    var info = eq.EarthquakeInfo || {};
    var epi  = info.Epicenter || {};
    var mag  = (info.EarthquakeMagnitude || {}).MagnitudeValue || '?';
    var loc  = epi.Location || '';
    var time = info.OriginTime || '';
    var dep  = info.FocalDepth ? info.FocalDepth+' km' : '';
    var img  = eq.ReportImageURI || '';
    var html =
      '<div style="font-size:14px;font-weight:700;color:#CC2200;margin-bottom:6px">🌋 地震報告</div>'+
      '<div style="font-size:13px;margin-bottom:3px">📍 '+loc+'</div>'+
      '<div style="font-size:13px;margin-bottom:3px">規模 <b>'+mag+'</b>'+(dep ? '　深度 '+dep : '')+'</div>'+
      '<div style="font-size:11px;color:#666;margin-bottom:6px">🕐 '+time+'</div>'+
      (img ? '<img src="'+img+'" style="width:280px;border-radius:6px;display:block;background:#eee" onerror="this.style.display=\'none\'">' : '')+
      '<div style="font-size:11px;color:#888;margin-top:6px">'+(eq.ReportContent||'')+'</div>';
    eqPopup=new maplibregl.Popup({maxWidth:'320px',closeButton:true})
      .setLngLat(lngLat).setHTML(html).addTo(window.map);
  }

  window.updateEqMapMarker = function(eq){
    var m = window.map;
    if(!m || !m.loaded()) return;
    if(!eq){ if(eqMarker){ eqMarker.remove(); eqMarker=null; } return; }
    var epi = (eq.EarthquakeInfo||{}).Epicenter||{};
    var lat = epi.EpicenterLatitude, lon = epi.EpicenterLongitude;
    if(!lat||!lon) return;
    makeEqIcon(m);
    if(eqMarker){
      eqMarker.setLngLat([lon,lat]);
      eqMarker.getElement()._eq = eq;
    } else {
      var el=document.createElement('div');
      el.style.cssText='width:48px;height:60px;cursor:pointer;font-size:36px;text-align:center;line-height:50px;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.45))';
      el.textContent='🌋';
      el._eq=eq;
      el.addEventListener('click',function(){ showEqPopup(el._eq,[lon,lat]); });
      eqMarker=new maplibregl.Marker({element:el,anchor:'bottom'})
        .setLngLat([lon,lat]).addTo(m);
    }
  };

  function tryInit(){
    var m=window.map;
    if(!m){ setTimeout(tryInit,300); return; }
    var fn=function(){ window.updateEqMapMarker(window.latestEarthquake||null); };
    if(m.loaded()) fn();
    else m.once('load',fn);
  }
  tryInit();
})();
</script>

<script>
/* ===== 🚦 臺北市號誌路口（GeoJSON cluster）===== */
(function(){
  var SOURCE = 'signals';
  var _popup = null;

  function makeEmojiImage(m, id, emoji, size){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    ctx.font = Math.floor(size*0.78)+'px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emoji, size/2, size/2);
    m.addImage(id, ctx.getImageData(0,0,size,size));
  }

  function initSignals(m){
    if(!window.SIGNAL_DATA) return;
    makeEmojiImage(m, 'signal-icon', '🚦', 48);

    m.addSource(SOURCE, {
      type: 'geojson',
      data: window.SIGNAL_DATA,
      cluster: true,
      clusterMaxZoom: 14,
      clusterRadius: 40
    });

    // 群集圓圈
    m.addLayer({
      id: 'signal-clusters',
      type: 'circle',
      source: SOURCE,
      filter: ['has','point_count'],
      paint: {
        'circle-color': ['step',['get','point_count'],'#22c55e',50,'#f59e0b',200,'#ef4444'],
        'circle-radius': ['step',['get','point_count'],14,50,20,200,26],
        'circle-opacity': 0.85
      }
    });

    // 群集數字
    m.addLayer({
      id: 'signal-cluster-count',
      type: 'symbol',
      source: SOURCE,
      filter: ['has','point_count'],
      layout: {
        'text-field': '{point_count_abbreviated}',
        'text-font': ['Noto Sans Bold','Open Sans Bold'],
        'text-size': 13
      },
      paint: {'text-color':'#fff'}
    });

    // 單一號誌 emoji（canvas 圖片）
    m.addLayer({
      id: 'signal-single',
      type: 'symbol',
      source: SOURCE,
      filter: ['!',['has','point_count']],
      layout: {
        'icon-image': 'signal-icon',
        'icon-size': 0.6,
        'icon-allow-overlap': false
      }
    });

    // 點擊群集 → 縮放進去
    m.on('click','signal-clusters',function(e){
      var feat = m.queryRenderedFeatures(e.point,{layers:['signal-clusters']})[0];
      m.getSource(SOURCE).getClusterExpansionZoom(feat.properties.cluster_id,function(err,zoom){
        if(err) return;
        m.easeTo({center:feat.geometry.coordinates, zoom:zoom});
      });
    });

    // 點擊單一號誌 → popup
    m.on('click','signal-single',function(e){
      var p = e.features[0].properties;
      var coord = e.features[0].geometry.coordinates.slice();
      if(_popup) _popup.remove();
      var urlRow = p.url ? `<tr><td colspan="2"><a href="${p.url}" target="_blank" style="color:#3b82f6">📄 時制報表</a></td></tr>` : '';
      var html = `<div style="font-size:13px;min-width:180px"><b>🚦 ${p.name||'號誌路口'}</b><table style="border-collapse:collapse;margin-top:6px;width:100%"><tr><td style="color:#888;padding:1px 4px">設備</td><td>${p.dev}</td></tr><tr><td style="color:#888;padding:1px 4px">路口ID</td><td>${p.icid}</td></tr><tr><td style="color:#888;padding:1px 4px">群組</td><td>${p.grp}</td></tr>${urlRow}</table></div>`;
      _popup = new maplibregl.Popup({closeButton:true, offset:16, maxWidth:'260px'})
        .setLngLat(coord).setHTML(html).addTo(m);
    });

    m.on('mouseenter','signal-clusters',function(){ m.getCanvas().style.cursor='pointer'; });
    m.on('mouseleave','signal-clusters',function(){ m.getCanvas().style.cursor=''; });
    m.on('mouseenter','signal-single',function(){ m.getCanvas().style.cursor='pointer'; });
    m.on('mouseleave','signal-single',function(){ m.getCanvas().style.cursor=''; });
  }

  function tryInit(){
    var m = window.map;
    if(!m){ setTimeout(tryInit,300); return; }
    if(m.loaded()) initSignals(m);
    else m.once('load', function(){ initSignals(m); });
  }
  tryInit();
})();
</script>

<script>
// ===== 🪙 金幣獎勵系統 v2 =====
(function(){
  const K_COIN    = 'sn_coins';
  const K_DATE    = 'sn_date';
  const K_STREAK  = 'sn_streak';
  const K_KM      = 'sn_km';
  const K_DAILY   = 'sn_daily_km';
  const K_MILE    = 'sn_milestones'; // JSON array of achieved km values
  const K_MISSION = 'sn_mission';    // 今日任務已完成 date string

  const LEVELS = [
    { min:0,    label:'Lv.1', name:'新手上路',  emoji:'🚗' },
    { min:50,   label:'Lv.2', name:'老司機',    emoji:'🚕' },
    { min:150,  label:'Lv.3', name:'資深駕駛',  emoji:'🚙' },
    { min:350,  label:'Lv.4', name:'導航大師',  emoji:'🏎️' },
    { min:700,  label:'Lv.5', name:'交通達人',  emoji:'✈️' },
  ];
  const MILESTONES = [
    { km:10,  coin:20,  label:'行駛10公里達成！' },
    { km:50,  coin:50,  label:'行駛50公里達成！' },
    { km:100, coin:100, label:'行駛100公里達成！' },
    { km:500, coin:200, label:'行駛500公里達成！' },
  ];

  let coins   = parseInt(localStorage.getItem(K_COIN)   || '0', 10);
  let totalKm = parseFloat(localStorage.getItem(K_KM)   || '0');
  let dailyKm = parseFloat(localStorage.getItem(K_DAILY)|| '0');
  let streak  = parseInt(localStorage.getItem(K_STREAK) || '1', 10);
  let doneMs  = JSON.parse(localStorage.getItem(K_MILE) || '[]');

  let _lastStep  = Math.floor(totalKm / 0.05); // 每 50m 一格
  let _toastQ    = [];  // toast 排隊
  let _toasting  = false;

  // ── 工具 ──────────────────────────────
  function getLv(c){ let r=LEVELS[0]; for(const l of LEVELS) if(c>=l.min) r=l; return r; }
  function isWeekend(){ const d=new Date().getDay(); return d===0||d===6; }

  function refresh(){
    localStorage.setItem(K_COIN, coins);
    const lv = getLv(coins);
    const bd = document.getElementById('coinLvBadge');
    const am = document.getElementById('coinAmt');
    const sk = document.getElementById('coinStreak');
    const sn = document.getElementById('coinStreakNum');
    if(bd) bd.textContent = lv.label;
    if(am) am.textContent = coins;
    if(sk && sn){ if(streak>=2){ sk.hidden=false; sn.textContent=streak+'天'; } else { sk.hidden=true; } }
    // 進度條
    const pf = document.getElementById('coinProgFill');
    if(pf){
      const idx = LEVELS.indexOf(lv);
      const next = LEVELS[idx+1];
      const pct = next ? Math.min(100,Math.round((coins-lv.min)/(next.min-lv.min)*100)) : 100;
      pf.style.width = pct + '%';
    }
  }

  // ── 飄字 ──────────────────────────────
  function floatAnim(amount, special){
    const disp = document.getElementById('coinDisplay');
    let x=window.innerWidth-90, y=90;
    if(disp){ const r=disp.getBoundingClientRect(); x=r.left; y=r.top-4; }
    const d = document.createElement('div');
    d.className = 'coinFloat';
    d.textContent = '+' + amount + ' 🪙';
    d.style.cssText = 'left:'+x+'px;top:'+y+'px';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 1700);
    // 暫時發光
    const disp2=document.getElementById('coinDisplay');
    if(disp2){ disp2.classList.add('glow'); setTimeout(()=>disp2.classList.remove('glow'),800); }
  }

  // ── Toast 隊列 ───────────────────────
  function showToast(msg){
    _toastQ.push(msg);
    if(!_toasting) flushToast();
  }
  function flushToast(){
    if(!_toastQ.length){ _toasting=false; return; }
    _toasting=true;
    const msg=_toastQ.shift();
    const t=document.createElement('div');
    t.className='coinToast';
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{ t.remove(); flushToast(); }, 1600);
  }

  // ── 升級動畫 ────────────────────────
  function levelUpAnim(lv){
    const el=document.createElement('div');
    el.className='coinLevelUp';
    el.innerHTML='<div class="lvUpTitle">'+lv.emoji+' 升級！</div><div class="lvUpName">'+lv.label+' '+lv.name+'</div>';
    document.body.appendChild(el);
    // 爆出 10 顆金幣
    for(let i=0;i<10;i++){
      setTimeout(()=>{
        const c=document.createElement('div');
        c.className='coinFloat';
        c.textContent='🪙';
        c.style.left=(Math.random()*window.innerWidth*0.7+window.innerWidth*0.1)+'px';
        c.style.top=(window.innerHeight*0.35+Math.random()*80)+'px';
        c.style.fontSize=(12+Math.random()*14)+'px';
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),1700);
      },i*80);
    }
    setTimeout(()=>el.remove(), 2900);
  }

  // ── 金幣音效 ────────────────────────
  function playCoinSound(type){
    try {
      const ctx = window.VP && VP._getCtx ? VP._getCtx() : new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      const t = ctx.currentTime;
      if(type==='levelup'){
        // 升級：四音符上行琶音
        [523,659,784,1047].forEach((hz,i)=>{
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value=hz; o.type='sine';
          const s=t+i*0.1;
          g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(0.22,s+0.02);
          g.gain.exponentialRampToValueAtTime(0.001,s+0.22);
          o.start(s); o.stop(s+0.25);
        });
      } else if(type==='big'){
        // 大獎：兩聲 ting
        [880,1047].forEach((hz,i)=>{
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value=hz; o.type='sine';
          const s=t+i*0.12;
          g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(0.2,s+0.01);
          g.gain.exponentialRampToValueAtTime(0.001,s+0.25);
          o.start(s); o.stop(s+0.28);
        });
      } else {
        // 普通：單聲 ting
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value=880; o.type='sine';
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        o.start(t); o.stop(t+0.2);
      }
    } catch(e){}
  }

  // ── 主要獎勵函式 ────────────────────
  function earn(amount, reason, forceNoMult){
    let mult = 1, notes = [];
    if(!forceNoMult){
      if(isWeekend()) { mult = Math.round(mult * 1.5); notes.push('🎉週末×1.5'); }
    }
    const total = Math.max(1, Math.round(amount * mult));
    const prevLv = getLv(coins);
    coins += total;
    refresh();
    floatAnim(total, notes.length > 0);
    const note = notes.length ? '（'+notes.join('·')+'）' : '';
    showToast(reason + (note?' '+note:'') + '  +' + total + ' 🪙');
    const newLv = getLv(coins);
    if(newLv.min > prevLv.min){
      playCoinSound('levelup');
      setTimeout(()=>levelUpAnim(newLv), 600);
    } else {
      playCoinSound(total >= 10 ? 'big' : 'normal');
    }
    window._lastEarnTime = Date.now();
  }
  window.earnCoin = earn;

  // ── 每日簽到 + 連續天數 ─────────────
  const today = new Date().toDateString();
  const lastDate = localStorage.getItem(K_DATE);
  if(lastDate !== today){
    // 判斷連續性（昨天有來）
    const yesterday = new Date(Date.now()-86400000).toDateString();
    streak = (lastDate === yesterday) ? streak+1 : 1;
    localStorage.setItem(K_STREAK, streak);
    localStorage.setItem(K_DATE, today);
    // 重置今日里程
    dailyKm = 0;
    localStorage.setItem(K_DAILY, '0');
    localStorage.removeItem(K_MISSION);
    refresh();
    // 簽到獎勵（連線 bonus）
    const base = 5;
    let bonus = 0, bonusMsg = '';
    if(streak===3){ bonus=10; bonusMsg=' 連續3天+10'; }
    else if(streak===7){ bonus=20; bonusMsg=' 連續7天+20'; }
    else if(streak>0 && streak%7===0){ bonus=20; bonusMsg=' 連續'+streak+'天+20'; }
    setTimeout(()=>{
      earn(base, '每日登入（第'+streak+'天）', true);
      if(bonus) setTimeout(()=>earn(bonus,'連線獎勵'+bonusMsg,true),800);
    }, 2200);
  } else {
    refresh();
  }

  // ── 距離追蹤：每 100m +1（夜間×2、週末×1.5）+ 里程碑 ──
  window._coinCheckDist = function(kmTotal){
    const prev = totalKm;
    totalKm = kmTotal;
    const delta = kmTotal - prev;
    if(delta > 0) dailyKm += delta;
    localStorage.setItem(K_KM, totalKm.toFixed(3));
    localStorage.setItem(K_DAILY, dailyKm.toFixed(3));

    // 每 50m +1
    const step = Math.floor(totalKm / 0.05);
    if(step > _lastStep){
      const gained = step - _lastStep;
      _lastStep = step;
      earn(gained, '🚗 +50m');
    }

    // 里程碑成就
    for(const m of MILESTONES){
      if(prev < m.km && totalKm >= m.km && !doneMs.includes(m.km)){
        doneMs.push(m.km);
        localStorage.setItem(K_MILE, JSON.stringify(doneMs));
        setTimeout(()=>earn(m.coin, '🏆 '+m.label, true), 300);
      }
    }

    // 每日任務：今天開車 2km
    const missionDone = localStorage.getItem(K_MISSION);
    if(!missionDone && dailyKm >= 2){
      localStorage.setItem(K_MISSION, today);
      localStorage.setItem('sn_miss_cnt', (parseInt(localStorage.getItem('sn_miss_cnt')||'0')+1));
      setTimeout(()=>earn(10,'🎯 每日任務：今天開車2km！',true), 400);
    }
  };

  // ── 持續行駛時間獎勵：每 2 分鐘 +1 ──
  let _driveTimer = null, _lastMoveTime = 0;
  window._coinDriveHeartbeat = function(){
    _lastMoveTime = Date.now();
    if(_driveTimer) return;
    _driveTimer = setInterval(()=>{
      if(Date.now() - _lastMoveTime > 15000){ clearInterval(_driveTimer); _driveTimer=null; return; }
      earn(1,'⏱ 持續行駛2分鐘');
    }, 120000);
  };

  // ── 監視器觸發 +1（每日上限8次）──
  const K_CCTV_CNT = 'sn_cctv_'+new Date().toDateString();
  window._coinCctv = function(){
    const cnt = parseInt(localStorage.getItem(K_CCTV_CNT)||'0',10);
    if(cnt >= 8) return;
    localStorage.setItem(K_CCTV_CNT, cnt+1);
    earn(1,'📹 發現監視器');
  };

  // ── 切換地圖樣式 +2（每日上限3次）──
  const K_STYLE_CNT = 'sn_style_'+new Date().toDateString();
  window._coinStyleSwitch = function(){
    const cnt = parseInt(localStorage.getItem(K_STYLE_CNT)||'0',10);
    if(cnt >= 3) return;
    localStorage.setItem(K_STYLE_CNT, cnt+1);
    earn(2,'🗺️ 切換地圖樣式',true);
  };

  // ── 每日第一次開始導航 +5 ──
  const K_NAV_DATE = 'sn_navdate';
  window._coinFirstNav = function(){
    const t = new Date().toDateString();
    if(localStorage.getItem(K_NAV_DATE) === t) return;
    localStorage.setItem(K_NAV_DATE, t);
    earn(5,'🧭 今日第一次導航',true);
  };

  // ── 成就定義 ──────────────────────────
  const ACHIEVEMENTS = [
    { id:'first_nav',  emoji:'🧭', name:'第一次導航', desc:'完成首次導航',        check:()=>!!localStorage.getItem('sn_navdate') },
    { id:'km10',       emoji:'🛣️', name:'公路旅人',   desc:'累積行駛10公里',      check:()=>totalKm>=10 },
    { id:'km50',       emoji:'🚗', name:'駕駛老手',   desc:'累積行駛50公里',      check:()=>totalKm>=50 },
    { id:'km100',      emoji:'🏆', name:'百公里達人', desc:'累積行駛100公里',     check:()=>totalKm>=100 },
    { id:'streak3',    emoji:'🔥', name:'連線熱度',   desc:'連續3天使用',         check:()=>streak>=3 },
    { id:'streak7',    emoji:'💎', name:'每日堅持',   desc:'連續7天使用',         check:()=>streak>=7 },
    { id:'cam5',       emoji:'📷', name:'守法模範',   desc:'守法通過5次測速',     check:()=>parseInt(localStorage.getItem('sn_cam_clean')||'0')>=5 },
    { id:'coin100',    emoji:'🪙', name:'金幣收藏家', desc:'累積100枚金幣',       check:()=>coins>=100 },
    { id:'coin500',    emoji:'💰', name:'金幣富翁',   desc:'累積500枚金幣',       check:()=>coins>=500 },
    { id:'mission3',   emoji:'🎯', name:'任務達人',   desc:'完成3次每日任務',     check:()=>parseInt(localStorage.getItem('sn_miss_cnt')||'0')>=3 },
  ];

  function renderStats(){
    const panel = document.getElementById('statsPanel');
    if(!panel) return;
    const lv  = getLv(coins);
    const nxt = LEVELS.find(l=>l.min>coins);
    const km  = (Math.round(totalKm*10)/10).toFixed(1);
    const dkm = Math.round(dailyKm*100)/100;
    const mis = localStorage.getItem(K_MISSION) ? '✅ 已完成' : dkm.toFixed(2)+'/2 km';
    const cctvCnt = parseInt(localStorage.getItem('sn_cctv_'+new Date().toDateString())||'0',10);
    const stylCnt = parseInt(localStorage.getItem('sn_style_'+new Date().toDateString())||'0',10);
    const wknd  = isWeekend() ? '<div style="color:#FFD700;text-align:center;margin:6px 0;font-size:13px;">🎉 週末 ×1.5 加成中！</div>' : '';
    const nextTxt = nxt ? `距 ${nxt.label} 還需 <b>${nxt.min-coins}</b> 枚` : '👑 已達最高等級！';
    document.getElementById('spContent').innerHTML = `
      <div style="text-align:center;margin-bottom:12px;">${lv.emoji} <b>${lv.label} ${lv.name}</b></div>
      ${wknd}
      <div class="spRow"><span>🪙 總金幣</span><span class="spVal">${coins}</span></div>
      <div class="spRow"><span>🔥 連續天數</span><span class="spVal">${streak} 天</span></div>
      <div class="spRow"><span>🛣️ 累積里程</span><span class="spVal">${km} km</span></div>
      <div style="font-size:11px;color:#888;text-align:center;margin:6px 0;">${nextTxt}</div>
      <div style="font-size:12px;font-weight:700;color:#FFD700;margin:12px 0 6px;">📋 今日任務</div>
      <div class="spRow"><span>🎯 開車 2km</span><span class="spVal">${mis}</span></div>
      <div class="spRow"><span>📹 監視器</span><span class="spVal">${cctvCnt}/8</span></div>
      <div class="spRow"><span>🗺️ 切換樣式</span><span class="spVal">${stylCnt}/3</span></div>
    `;
    const ach = document.getElementById('achGrid2');
    if(ach){
      ach.innerHTML = ACHIEVEMENTS.map(a=>`
        <div class="achBadge2${a.check()?'':' locked'}">
          <div class="abEmoji">${a.emoji}</div>
          <div><div class="abName">${a.name}</div><div class="abDesc">${a.desc}</div></div>
        </div>`).join('');
    }
    panel.classList.add('open');
  }

  // ── 金幣提示系統 ─────────────────────
  const COIN_HINTS = [
    '🧭 開始導航，每個轉彎 +2🪙',
    '🏁 抵達目的地 +15🪙',
    '📷 守法通過測速照相 +5🪙',
    '📹 靠近監視器自動切換 +1🪙',
    '🎯 每天開車2公里完成任務 +10🪙',
    '🗺️ 切換地圖樣式 +2🪙（每日3次）',
    '🔥 連續使用越多天，簽到越多金幣',
    '🎉 週末自動×1.5加成，外出賺更多',
    '🛣️ 每行駛50公尺 +1🪙',
    '🏆 達到里程碑（5/10/20...km）有大獎',
  ];
  let _hintIdx = 0;

  // 情境提示：直接用既有 toast
  window._hintCoinNav   = ()=> showToast('🧭 開始導航！每個轉彎 +2🪙，抵達 +15🪙');
  window._hintCoinCam   = ()=> showToast('📷 前方測速照相！守法通過 +5🪙');
  window._hintCoinCctv  = ()=> showToast('📹 監視器 +1🪙（每日最多8次）');

  // 閒置提示：3分鐘沒賺幣就提示一條
  window._lastEarnTime = Date.now();
  setInterval(()=>{
    if(Date.now() - (window._lastEarnTime||0) > 3*60*1000){
      showToast(COIN_HINTS[_hintIdx % COIN_HINTS.length]);
      _hintIdx++;
      window._lastEarnTime = Date.now();
    }
  }, 60*1000);

  // ── tripCloseBtn ────────────────────
  const tcb = document.getElementById('tripCloseBtn');
  if(tcb) tcb.addEventListener('click', ()=>{
    document.getElementById('tripSummaryCard')?.classList.remove('open');
  });

  // ── stats panel 開關 ────────────────
  const spCloseBtn = document.getElementById('spClose');
  if(spCloseBtn) spCloseBtn.addEventListener('click', ()=>{
    document.getElementById('statsPanel')?.classList.remove('open');
  });

  // ── 點擊查看詳情 ────────────────────
  const cd = document.getElementById('coinDisplay');
  if(cd) cd.addEventListener('click', renderStats);

})();
</script>
